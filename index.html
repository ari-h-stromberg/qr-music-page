<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Track Picker</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    /* dvh keeps the split correct when mobile browser chrome shows and hides. */
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at top, #2b1055 0%, #0a0a1a 65%, #050510 100%);
    color: #f5f5f7;
  }

  .slideshow {
    position: relative;
    flex: 0 0 60%;
    width: 100%;
    overflow: hidden;
    background: #12102a;
  }
  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 1.1s ease-in-out;
  }
  .slide.visible { opacity: 1; }
  .slide-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    filter: blur(22px) brightness(0.45);
    transform: scale(1.15);
  }
  /* On a phone the frame is taller than it is wide, so filling it keeps the
     photo large. These shots are centre-composed, so the side crop is safe. */
  .slide-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /* On wide screens the frame becomes a letterbox, where cropping to fill would
     reduce a portrait photo to a thin slice. Show the whole photo instead and
     let the blurred copy behind it fill the leftover space. */
  @media (min-aspect-ratio: 1/1) {
    .slide-img { object-fit: contain; }
  }
  .slideshow::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 60px;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(5, 5, 16, 0), rgba(5, 5, 16, 0.85));
  }
  @media (prefers-reduced-motion: reduce) {
    .slide { transition: none; }
  }

  .panel {
    flex: 1 1 40%;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }

  .instructions {
    margin: 0;
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255, 110, 196, 0.35);
    background: rgba(255, 110, 196, 0.1);
    text-align: center;
    font-size: 13px;
    line-height: 1.35;
    color: rgba(245, 245, 247, 0.9);
  }
  .instructions strong {
    color: #ffb3e0;
    font-weight: 600;
  }

  .track-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .track {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 9px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.05);
    color: inherit;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .track:hover { background: rgba(255, 255, 255, 0.09); }
  .track:active { transform: scale(0.98); }
  .track.active {
    background: rgba(120, 115, 245, 0.2);
    border-color: rgba(120, 115, 245, 0.55);
  }
  .track-icon {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    border-radius: 8px;
    background: linear-gradient(135deg, #ff6ec4, #7873f5 50%, #4adede);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
  }
  .track-name {
    flex: 1;
    font-weight: 500;
  }
  .track-status {
    font-size: 11px;
    color: rgba(245, 245, 247, 0.5);
    min-width: 44px;
    text-align: right;
  }

  audio {
    width: 100%;
    height: 32px;
    margin-top: 2px;
    accent-color: #7873f5;
  }

  /* Shorter phones: tighten the panel so its contents still fit inside the
     bottom 40% instead of clipping or forcing a scroll. */
  @media (max-height: 800px) {
    .panel { gap: 6px; padding: 8px 14px calc(8px + env(safe-area-inset-bottom)); }
    .instructions { font-size: 12px; padding: 6px 10px; }
    .track-list { gap: 5px; }
    .track { padding: 7px 10px; font-size: 13px; }
    .track-icon { width: 24px; height: 24px; font-size: 12px; }
  }
  @media (max-height: 680px) {
    .panel { gap: 5px; }
    .instructions { font-size: 11px; line-height: 1.3; }
    .track-list { gap: 4px; }
    .track { padding: 6px 10px; }
    .track-icon { width: 22px; height: 22px; }
    audio { height: 28px; }
  }
</style>
</head>
<body>
  <div class="slideshow" id="slideshow">
    <div class="slide"><div class="slide-bg"></div><img class="slide-img" alt="" /></div>
    <div class="slide"><div class="slide-bg"></div><img class="slide-img" alt="" /></div>
  </div>

  <div class="panel">
    <p class="instructions">
      Listen to each of these tracks to solve the puzzle,
      <strong>be sure to listen all the way to the end!</strong>
    </p>

    <div class="track-list" id="track-list"></div>

    <audio id="player" controls preload="none">
      Your browser does not support the audio element.
    </audio>
  </div>

  <script>
    const tracks = [
      { title: 'Track X', src: 'audio/track1.mp3', icon: 'X' },
      { title: 'Track Y', src: 'audio/track2.mp3', icon: 'Y' },
      { title: 'Track Z', src: 'audio/track3.mp3', icon: 'Z' },
      { title: 'Track Q', src: 'audio/track4.mp3', icon: 'Q' },
    ];

    const listEl = document.getElementById('track-list');
    const player = document.getElementById('player');
    let activeIndex = null;

    function render() {
      listEl.innerHTML = '';
      tracks.forEach((track, i) => {
        const btn = document.createElement('button');
        btn.className = 'track' + (i === activeIndex ? ' active' : '');
        btn.innerHTML = `
          <span class="track-icon">${track.icon}</span>
          <span class="track-name">${track.title}</span>
          <span class="track-status">${i === activeIndex && !player.paused ? 'Playing' : ''}</span>
        `;
        btn.addEventListener('click', () => selectTrack(i));
        listEl.appendChild(btn);
      });
    }

    function selectTrack(i) {
      if (activeIndex === i) {
        player.paused ? player.play() : player.pause();
        return;
      }
      activeIndex = i;
      player.src = tracks[i].src;
      player.play().catch(() => {
        /* Autoplay blocked — user can tap the native controls instead. */
      });
      render();
    }

    player.addEventListener('play', render);
    player.addEventListener('pause', render);
    player.addEventListener('ended', render);

    render();

    const SLIDE_MS = 5000;
    const slides = [...document.querySelectorAll('#slideshow .slide')];
    let slot = 0;

    function paint(slideEl, src) {
      slideEl.querySelector('.slide-img').src = src;
      slideEl.querySelector('.slide-bg').style.backgroundImage = `url("${src}")`;
    }

    function load(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = resolve;
        img.onerror = reject;
        img.src = src;
      });
    }

    async function startSlideshow() {
      let photos;
      try {
        photos = await (await fetch('photos/photos.json')).json();
      } catch {
        return; // Leave the frame empty rather than breaking the track list.
      }
      if (!photos.length) return;

      const srcOf = (i) => `photos/${photos[i % photos.length]}`;

      await load(srcOf(0));
      paint(slides[0], srcOf(0));
      slides[0].classList.add('visible');

      if (photos.length === 1) return;

      // Only ever fetch the next photo, so a phone on cellular isn't asked to
      // download all of them up front.
      let next = 1;
      while (true) {
        const src = srcOf(next);
        try {
          await load(src);
        } catch {
          next++;
          continue;
        }
        await new Promise((r) => setTimeout(r, SLIDE_MS));
        const incoming = slides[1 - slot];
        paint(incoming, src);
        incoming.classList.add('visible');
        slides[slot].classList.remove('visible');
        slot = 1 - slot;
        next++;
      }
    }

    startSlideshow();
  </script>
</body>
</html>
