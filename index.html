<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Track Picker</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at top, #2b1055 0%, #0a0a1a 65%, #050510 100%);
    color: #f5f5f7;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(16px);
    border-radius: 24px;
    padding: 28px 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }
  .header {
    text-align: center;
    margin-bottom: 24px;
  }
  .art {
    width: 100px;
    height: 100px;
    margin: 0 auto 16px;
    border-radius: 20px;
    background: linear-gradient(135deg, #ff6ec4, #7873f5 50%, #4adede);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    box-shadow: 0 12px 30px rgba(120, 115, 245, 0.4);
    animation: spin 12s linear infinite paused;
  }
  .art.playing { animation-play-state: running; }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    font-weight: 600;
  }
  p.subtitle {
    margin: 0;
    color: rgba(245, 245, 247, 0.6);
    font-size: 14px;
  }
  .instructions {
    margin: 0 0 20px;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid rgba(255, 110, 196, 0.35);
    background: rgba(255, 110, 196, 0.1);
    text-align: center;
    font-size: 15px;
    line-height: 1.5;
    color: rgba(245, 245, 247, 0.9);
  }
  .instructions strong {
    display: block;
    margin-top: 4px;
    color: #ffb3e0;
    font-weight: 600;
  }
  .track-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  .track {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.04);
    color: inherit;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .track:hover {
    background: rgba(255, 255, 255, 0.08);
  }
  .track:active {
    transform: scale(0.98);
  }
  .track.active {
    background: rgba(120, 115, 245, 0.18);
    border-color: rgba(120, 115, 245, 0.5);
  }
  .track-icon {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    border-radius: 10px;
    background: linear-gradient(135deg, #ff6ec4, #7873f5 50%, #4adede);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }
  .track-name {
    flex: 1;
    font-weight: 500;
  }
  .track-status {
    font-size: 12px;
    color: rgba(245, 245, 247, 0.45);
    min-width: 46px;
    text-align: right;
  }
  audio {
    width: 100%;
    accent-color: #7873f5;
  }
  .hint {
    margin-top: 14px;
    text-align: center;
    font-size: 12px;
    color: rgba(245, 245, 247, 0.45);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="art" id="art">🎵</div>
      <h1>Pick a Track</h1>
      <p class="subtitle">Tap one to play it</p>
    </div>

    <p class="instructions">
      Listen to each of these tracks to solve the puzzle,
      <strong>be sure to listen all the way to the end!</strong>
    </p>

    <div class="track-list" id="track-list"></div>

    <audio id="player" controls preload="none">
      Your browser does not support the audio element.
    </audio>
    <p class="hint">Tap a track to start it, tap again to pause</p>
  </div>

  <script>
    const tracks = [
      { title: 'Track X', src: 'audio/track1.mp3', icon: 'X' },
      { title: 'Track Y', src: 'audio/track2.mp3', icon: 'Y' },
      { title: 'Track Z', src: 'audio/track3.mp3', icon: 'Z' },
      { title: 'Track Q', src: 'audio/track4.mp3', icon: 'Q' },
    ];

    const listEl = document.getElementById('track-list');
    const player = document.getElementById('player');
    const art = document.getElementById('art');
    let activeIndex = null;

    function render() {
      listEl.innerHTML = '';
      tracks.forEach((track, i) => {
        const btn = document.createElement('button');
        btn.className = 'track' + (i === activeIndex ? ' active' : '');
        btn.innerHTML = `
          <span class="track-icon">${track.icon}</span>
          <span class="track-name">${track.title}</span>
          <span class="track-status">${i === activeIndex && !player.paused ? 'Playing' : ''}</span>
        `;
        btn.addEventListener('click', () => selectTrack(i));
        listEl.appendChild(btn);
      });
    }

    function selectTrack(i) {
      if (activeIndex === i) {
        player.paused ? player.play() : player.pause();
        return;
      }
      activeIndex = i;
      player.src = tracks[i].src;
      player.play().catch(() => {
        /* Autoplay blocked — user can tap the native controls instead. */
      });
      render();
    }

    player.addEventListener('play', () => { art.classList.add('playing'); render(); });
    player.addEventListener('pause', () => { art.classList.remove('playing'); render(); });
    player.addEventListener('ended', () => { art.classList.remove('playing'); render(); });

    render();
  </script>
</body>
</html>
