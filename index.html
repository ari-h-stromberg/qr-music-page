<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Track Picker</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at top, #2b1055 0%, #0a0a1a 65%, #050510 100%);
    color: #f5f5f7;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(16px);
    border-radius: 24px;
    padding: 28px 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }
  .header {
    text-align: center;
    margin-bottom: 24px;
  }
  .slideshow {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    margin: 0 auto 16px;
    border-radius: 18px;
    overflow: hidden;
    background: #12102a;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
  }
  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 1.1s ease-in-out;
  }
  .slide.visible { opacity: 1; }
  /* Photos are a mix of portrait and landscape. The blurred, cropped copy fills
     the frame so the contained photo above it never sits on empty letterboxing. */
  .slide-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    filter: blur(18px) brightness(0.5);
    transform: scale(1.15);
  }
  .slide-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  @media (prefers-reduced-motion: reduce) {
    .slide { transition: none; }
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    font-weight: 600;
  }
  p.subtitle {
    margin: 0;
    color: rgba(245, 245, 247, 0.6);
    font-size: 14px;
  }
  .instructions {
    margin: 0 0 20px;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid rgba(255, 110, 196, 0.35);
    background: rgba(255, 110, 196, 0.1);
    text-align: center;
    font-size: 15px;
    line-height: 1.5;
    color: rgba(245, 245, 247, 0.9);
  }
  .instructions strong {
    display: block;
    margin-top: 4px;
    color: #ffb3e0;
    font-weight: 600;
  }
  .track-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  .track {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.04);
    color: inherit;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .track:hover {
    background: rgba(255, 255, 255, 0.08);
  }
  .track:active {
    transform: scale(0.98);
  }
  .track.active {
    background: rgba(120, 115, 245, 0.18);
    border-color: rgba(120, 115, 245, 0.5);
  }
  .track-icon {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    border-radius: 10px;
    background: linear-gradient(135deg, #ff6ec4, #7873f5 50%, #4adede);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }
  .track-name {
    flex: 1;
    font-weight: 500;
  }
  .track-status {
    font-size: 12px;
    color: rgba(245, 245, 247, 0.45);
    min-width: 46px;
    text-align: right;
  }
  audio {
    width: 100%;
    accent-color: #7873f5;
  }
  .hint {
    margin-top: 14px;
    text-align: center;
    font-size: 12px;
    color: rgba(245, 245, 247, 0.45);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="slideshow" id="slideshow">
        <div class="slide"><div class="slide-bg"></div><img class="slide-img" alt="" /></div>
        <div class="slide"><div class="slide-bg"></div><img class="slide-img" alt="" /></div>
      </div>
      <h1>Pick a Track</h1>
      <p class="subtitle">Tap one to play it</p>
    </div>

    <p class="instructions">
      Listen to each of these tracks to solve the puzzle,
      <strong>be sure to listen all the way to the end!</strong>
    </p>

    <div class="track-list" id="track-list"></div>

    <audio id="player" controls preload="none">
      Your browser does not support the audio element.
    </audio>
    <p class="hint">Tap a track to start it, tap again to pause</p>
  </div>

  <script>
    const tracks = [
      { title: 'Track X', src: 'audio/track1.mp3', icon: 'X' },
      { title: 'Track Y', src: 'audio/track2.mp3', icon: 'Y' },
      { title: 'Track Z', src: 'audio/track3.mp3', icon: 'Z' },
      { title: 'Track Q', src: 'audio/track4.mp3', icon: 'Q' },
    ];

    const listEl = document.getElementById('track-list');
    const player = document.getElementById('player');
    let activeIndex = null;

    function render() {
      listEl.innerHTML = '';
      tracks.forEach((track, i) => {
        const btn = document.createElement('button');
        btn.className = 'track' + (i === activeIndex ? ' active' : '');
        btn.innerHTML = `
          <span class="track-icon">${track.icon}</span>
          <span class="track-name">${track.title}</span>
          <span class="track-status">${i === activeIndex && !player.paused ? 'Playing' : ''}</span>
        `;
        btn.addEventListener('click', () => selectTrack(i));
        listEl.appendChild(btn);
      });
    }

    function selectTrack(i) {
      if (activeIndex === i) {
        player.paused ? player.play() : player.pause();
        return;
      }
      activeIndex = i;
      player.src = tracks[i].src;
      player.play().catch(() => {
        /* Autoplay blocked — user can tap the native controls instead. */
      });
      render();
    }

    player.addEventListener('play', render);
    player.addEventListener('pause', render);
    player.addEventListener('ended', render);

    render();

    const SLIDE_MS = 5000;
    const slides = [...document.querySelectorAll('#slideshow .slide')];
    let slot = 0;

    function paint(slideEl, src) {
      slideEl.querySelector('.slide-img').src = src;
      slideEl.querySelector('.slide-bg').style.backgroundImage = `url("${src}")`;
    }

    function load(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = resolve;
        img.onerror = reject;
        img.src = src;
      });
    }

    async function startSlideshow() {
      let photos;
      try {
        photos = await (await fetch('photos/photos.json')).json();
      } catch {
        return; // Leave the frame empty rather than breaking the track list.
      }
      if (!photos.length) return;

      const srcOf = (i) => `photos/${photos[i % photos.length]}`;

      await load(srcOf(0));
      paint(slides[0], srcOf(0));
      slides[0].classList.add('visible');

      if (photos.length === 1) return;

      // Only ever fetch the next photo, so a phone on cellular isn't asked to
      // download all of them up front.
      let next = 1;
      while (true) {
        const src = srcOf(next);
        try {
          await load(src);
        } catch {
          next++;
          continue;
        }
        await new Promise((r) => setTimeout(r, SLIDE_MS));
        const incoming = slides[1 - slot];
        paint(incoming, src);
        incoming.classList.add('visible');
        slides[slot].classList.remove('visible');
        slot = 1 - slot;
        next++;
      }
    }

    startSlideshow();
  </script>
</body>
</html>
