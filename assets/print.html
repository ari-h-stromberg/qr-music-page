<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Print QR Code</title>
<style>
  @page { size: letter; margin: 1in; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
  }
  img {
    width: 3.5in;
    height: 3.5in;
    image-rendering: pixelated;
  }
  h1 {
    font-size: 22px;
    margin: 24px 0 4px;
  }
  p {
    font-size: 13px;
    color: #555;
    margin: 0;
  }
</style>
</head>
<body>
  <img src="qr-code.png" alt="QR Code" />
  <h1>Scan to Play</h1>
  <p>can-lizzy-escape.us</p>
</body>
</html>
